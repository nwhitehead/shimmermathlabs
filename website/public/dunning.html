does the Dunning–Kruger effect most directly describe?",options:[{key:"A",text:"Less intelligent people are more confident than intelligent people"},{key:"B",text:"Poor performers in a domain tend to overestimate their performance in that domain"},{key:"C",text:"Beginners initially become extremely confident, then lose confidence as they learn"},{key:"D",text:"Experts usually believe they are beginners"}],answer:"B",explanation:"The original work concerned miscalibration in particular domains, not general intelligence.",source:{label:"Kruger & Dunning (1999), Unskilled and Unaware of It",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:2,question:"In the original 1999 experiments, which abilities were tested?",options:[{key:"A",text:"Mathematics, chess, and vocabulary"},{key:"B",text:"Memory, spatial reasoning, and arithmetic"},{key:"C",text:"Humor, grammar, and logical reasoning"},{key:"D",text:"Driving, leadership, and financial literacy"}],answer:"C",explanation:"The original studies tested humor, grammar, and logical reasoning.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:3,question:"In the original paper, bottom-quartile participants averaged about what actual percentile?",options:[{key:"A",text:"12th"},{key:"B",text:"25th"},{key:"C",text:"38th"},{key:"D",text:"49th"}],answer:"A",explanation:"Across the studies summarized by the authors, their average actual standing was around the 12th percentile.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:4,question:"And what percentile did those bottom-quartile participants estimate themselves to be in?",options:[{key:"A",text:"18th"},{key:"B",text:"34th"},{key:"C",text:"49th"},{key:"D",text:"62nd"}],answer:"D",explanation:"Paired with the previous question: participants actually averaging around the 12th percentile estimated themselves at about the 62nd.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:5,question:"According to Kruger and Dunning's proposed explanation, why might poor performers misjudge themselves?",options:[{key:"A",text:"They deliberately lie about their performance"},{key:"B",text:"Some of the skills needed to perform well are also needed to recognize good performance"},{key:"C",text:"They have unusually high self-esteem"},{key:"D",text:"They forget what questions they answered"}],answer:"B",explanation:"This was their metacognitive account: some of the same skills needed to perform well are also needed to recognize good performance.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:6,question:"What is “metacognition” in this context?",options:[{key:"A",text:"Knowledge about psychology"},{key:"B",text:"Thinking extremely carefully"},{key:"C",text:"Ability to assess one's own thinking or performance"},{key:"D",text:"Comparing yourself socially with other people"}],answer:"C",explanation:"Metacognition here means the ability to assess one's own thinking or performance.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:7,question:"What happened when low performers in one experiment were taught skills that improved their logical reasoning?",options:[{key:"A",text:"Their estimates became even more inflated"},{key:"B",text:"Their self-assessments became more accurate"},{key:"C",text:"Nothing changed"},{key:"D",text:"They became less skilled but more cautious"}],answer:"B",explanation:"Training also improved their ability to recognize their earlier errors.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:8,question:"Did the best performers in the original studies assess themselves perfectly?",options:[{key:"A",text:"Yes"},{key:"B",text:"No; they tended to underestimate their relative standing"},{key:"C",text:"No; they massively overestimated themselves too"},{key:"D",text:"The researchers didn't ask them"}],answer:"B",explanation:"The top quartile tended to underestimate how unusually well they had performed relative to peers.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:9,question:"Does Dunning–Kruger predict that a complete novice will necessarily think they're an expert?",options:[{key:"A",text:"Yes"},{key:"B",text:"No"}],answer:"B",explanation:"The original authors noted that in domains where people have essentially no idea how to respond, they may underestimate themselves instead. Some minimal knowledge may be necessary to form an inflated assessment at all.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:10,question:"Which statement about the famous “Mount Stupid → Valley of Despair → Slope of Enlightenment” graph is most accurate?",options:[{key:"A",text:"It appeared in Kruger & Dunning's 1999 paper"},{key:"B",text:"It reproduces one of their experimental graphs exactly"},{key:"C",text:"It is a popular illustration, not the finding plotted in their original paper"},{key:"D",text:"Dunning invented it during the experiments"}],answer:"C",explanation:"The original study plotted assessed and actual performance by performance quartile, not that familiar confidence-versus-experience roller coaster.",source:{label:"Kruger & Dunning (1999)",url:"https://sites.lsa.umich.edu/sasi/wp-content/uploads/sites/275/2015/11/krugerdunning99.pdf"}},{id:11,question:"Which person is exhibiting something closest to the Dunning–Kruger pattern?",op
