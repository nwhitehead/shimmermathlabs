    <script type="module" crossorigin>(function(){const n=document.createElement("link").relList;if(n&&n.supports&&n.supports("modulepreload"))return;for(const i of document.querySelectorAll('link[rel="modulepreload"]'))c(i);new MutationObserver(i=>{for(const l of i)if(l.type==="childList")for(const m of l.addedNodes)m.tagName==="LINK"&&m.rel==="modulepreload"&&c(m)}).observe(document,{childList:!0,subtree:!0});function r(i){const l={};return i.integrity&&(l.integrity=i.integrity),i.referrerPolicy&&(l.referrerPolicy=i.referrerPolicy),i.crossOrigin==="use-credentials"?l.credentials="include":i.crossOrigin==="anonymous"?l.credentials="omit":l.credentials="same-origin",l}function c(i){if(i.ep)return;i.ep=!0;const l=r(i);fetch(i.href,l)}})();const re="Response maps for common insecurities, normalized for machine use. Includes reality branches, safety gates, structured experiments, controlled vocabularies, symmetric related-entry links, differential distinctions, and orthogonal taxonomy dimensions.",se=JSON.parse(`[{"id":1,"insecurity":"I'm not useful enough / contributing enough.","core_belief":"My value depends on how useful I am and how much I contribute.","hidden_conditional":"If I do not contribute enough, I do not deserve care, respect, or a place in other people's lives.","validation":"It can genuinely hurt to feel that your abilities or time are not producing what you hoped they would.","insecurity_voice":"No, this is not abstract self-esteem. I have abilities and opportunities, and I am objectively producing less than I could. Other people are carrying more weight. Why shouldn't that matter?","maintenance_loop":["Compare output with other people or an imagined potential self","Interpret the gap as moral failure","Use shame or self-attack to force productivity","Overwork, avoid, or become demoralized","Produce less sustainably","Treat the result as proof of low worth"],"best_question":"If someone you loved contributed very little for a year, would their human worth to you disappear?","behavioral_experiment":{"prediction":"If I do not contribute enough, I do not deserve care, respect, or a place in other people's lives.","action":"Choose one small contribution because you value it, not as proof of worth; separately spend one bounded period doing something nonproductive and observe whether relationships or respect actually collapse.","observable_outcomes":["People continue choosing the relationship during low-output periods","Contribution varies substantially over time while attachment remains","Useful action becomes easier when shame is reduced rather than intensified"],"time_horizon":"Use one bounded trial or a short predefined observation window; use longer repeated samples only when the predicted outcome itself unfolds over time.","stopping_rule":"Stop or redesign the experiment if it becomes unsafe, coercive, materially costly, or turns into repeated checking/reassurance rather than information gathering."},"disconfirming_evidence":["People continue choosing the relationship during low-output periods","Contribution varies substantially over time while attachment remains","Useful action becomes easier when shame is reduced rather than intensified"],"goal":"Make worth less contingent on usefulness while preserving freely chosen contribution.","avoid_saying":[{"phrase":"You're already incredibly useful.","reason":"Offers global reassurance that is easy to discount and can strengthen reassurance-seeking."},{"phrase":"You contribute more than you realize.","reason":"Targets the feeling with reassurance or a slogan rather than addressing the specific prediction, behavior, or maintenance loop."},{"phrase":"Don't compare yourself to anyone.","reason":"Targets the feeling with reassurance or a slogan rather than addressing the specific prediction, behavior, or maintenance loop."}],"mechanisms":["conditional_self_worth","global_self_judgment","moralization","self_criticism","social_comparison"],"related_insecurities":[4,9,10,11,12,14,18,20,30,49,50,54,66,73],"research_basis":["behavioral_experiments_and_practice","cognitive_behavioral","conditional_self_worth_research","self_compassion"],"pushbacks":[{"pushback":"But I genuinely don't contribute very much.","response":"Maybe. That's a claim about your current output, not your value as a person. What contribution do you actually want to make?","move_type":"separate_or_deglobalize","move_note":"Separate fact from identity."},{"pushback":"If I'm not useful, why should anyone want me around?","response":"People aren't normally loved according to a utility function. Do you value your friends only in proportion to their productivity?","move_type":"symmetry_test","move_note":"Apply the standard symmetrically."},{"pushback":"Other people accomplish much more than I do.","response":"True of almost everyone. Comparison can tell you what is possible; it can't tell you what you're worth.","move_type":"status_deglobalization","move_note":"Remove ranking from worth."},{"pushback":"If I accept myself, I'll become lazy.","response":"Acceptance isn't the same as giving up. Self-compassion can support motivation to improve after failure.","move_type":"reframe_definition","move_note":"Remove self-punishment as motivational tool."},{"pushback":"But I'm wasting my abilities.","response":"Then choose one ability you actually want to use and use it. Punishing yourself for hypothetical output produces no output.","move_type":"action_orientation","move_note":"Convert judgment into action."}],"provenance":{"origin":"thread-derived","source_ref":"v2.5:entry:1","generation_batch":"original_thread_distillation","content_version":"3.0"},"domains":["family_and_caregiving","money_and_resources","self_regulation_and_habits","self_worth","status_and_achievement","work_and_competence"],"primary_domain":"status_and_achievement","mechanism_details":["conditional_self_worth","social_comparison","moralization_of_productivity","global_self_judgment","self_criticism"],"research_basis_details":["contingencies of self-worth","CBT for low self-esteem","self-compassion","behavioral experiments"],"distinguish_from":[{"id":50,"difference":"Usefulness/contribution is one contingency of worth; #50 is the broader belief that existence itself must be justified."}],"evidence_concern_is_real":["A concrete goal genuinely requires credentials, access, output, or performance you do not yet have.","Independent measures show a relevant gap.","The concern survives after separating the desired resource from rank or prestige itself."],"if_true_action":"Pursue the underlying resource or capability directly, with explicit standards, rather than using rank as a global verdict.","uncertainty_strategy":"Compare against task requirements and your own stated goals, not an indefinitely escalating reference group.","safety_gate":null,"professional_evaluation_triggers":[],"response_families":["behavioral_experiment","self_compassion","skills_and_feedback"]},{"id":2,"insecurity":"People see me negatively.","core_belief":"Acceptance depends on managing other people's impressions of me.","hidden_conditional":"If people see me being awkward, quiet, strange, or unfiltered, they will reject or devalue me.","validation":"People really do judge one another, and some social mistakes have consequences.","insecurity_voice":"You can tell me not to care what people think, but people decide whether to include, hire, date, trust, or avoid me. Monitoring myself is not imaginary; it is how I prevent bad outcomes.","maintenance_loop":["Enter interaction expecting judgment","Monitor self intensely","Use masking, scripting, reassurance, or other safety behaviors","Feel less spontaneous and more strained","Notice ambiguous reactions","Interpret them as confirmation that the unguarded self is unacceptable"],"best_question":"What exactly do you predict will happen if you let one small piece of impression management go?","behavioral_experiment":{"prediction":"If people see me being awkward, quiet, strange, or unfiltered, they will reject or devalue me.","action":"In a low-stakes interaction, drop one safety behavior—overexplaining, rehearsing, apologizing, forced smalltalk, or constant self-monitoring—and record what actually happens.","observable_outcomes":["Some awkward moments produce no meaningful consequence","People continue engaging without perfect impression management","Reduced self-monitoring can make interaction easier rather than worse"],"time_horizon":"Use one bounded trial or a short predefined observation window; use longer repeated samples only when the predicted outcome itself unfolds over time.","stopping_rule":"Stop or redesign the experiment if it becomes unsafe, coercive, materially costly, or turns into repeated checking/reassurance rather than information gathering."},"disconfirming_evidence":["Some awkward moments produce no meaningful consequence","People continue engaging without perfect impression management","Reduced self-monitoring can make interaction easier rather than worse"],"goal":"Reduce the requirement to control every impression and improve tolerance for ordinary social uncertainty.","avoid_saying":[{"phrase":"Nobody is judging you.","reason":"Makes an overbroad reassurance or denial that may be false and leaves the underlying mechanism untouched."},{"phrase":"Just be yourself.","reason":"Oversimplifies a maintained pattern as a simple choice and can add shame when the advice does not work."},{"phrase":"Who cares what people think?","reason":"Targets the feeling with reassurance or a slogan rather than addressing the specific prediction, behavior, or maintenance loop."}],"mechanisms":["avoidance","catastrophizing","checking_monitoring","mind_reading"],"related_insecurities":[5,6,13,17,18,27,38,40,78,79,80,95],"research_basis":["behavioral_experiments_and_practice","cognitive_behavioral","exposure_and_response_prevention"],"pushbacks":[{"pushback":"But people really do judge me.","response":"Yes. The goal can't be to make nobody judge you. It's to discover how much judgment actually matters.","move_type":"reframe_definition","move_note":"Concede reality; shrink consequence."},{"pushback":"If I stop monitoring myself, I'll say something weird.","response":"Probably eventually. The experiment is whether 'something weird' causes the catastrophe you predict.","move_type":"behavioral_test","move_note":"Behavioral experiment."},{"pushback":"I can tell when people think I'm awkward.","response":"Sometimes. But noticing a reaction isn't the same as knowing its meaning, duration, or importance.","move_type":"separate_or_deglobalize","move_note":"Separate observation from inference."},{"pushback":"I have to mask/manage myself or people won't like me.","response":"Try removing one small piece of management rather than all of it. See what happens.","move_type":"strategy_adjustment","move_note":"Drop safety behaviors gradually."},{"pushback":"A bad impression can have real consequences.","response":"Absolutely. Use impression management where the stakes genuinely justify it. The question is why every ordinary interaction has become a job interview.","move_type":"reframe_definition","move_note":"Contextualize the defense."}],"provenance":{"origin":"thread-derived","source_ref":"v2.5:entry:2","generation_batch":"original_thread_distillation","content_version":"3.0"},"domains":["social_and_belonging","status_and_achievement"],"primary_domain":"social_and_belonging","mechanism_details":["mind_reading","self_focused_attention","safety_behaviors","avoidance","catastrophizing"],"research_basis_details":["CBT for social anxiety","exposure","reduction of safety behaviors","behavioral experiments"],"distinguish_from":[{"id":78,"difference":"General fear of negative evaluation differs from the specific belief that politeness is concealing dislike."}],"evidence_concern_is_real":["Multiple people independently give similar behavior-level feedback.","Observable patterns of withdrawal, nonresponse, conflict, or exclusion recur across contexts.","The concern remains after distinguishing fit, scheduling, bandwidth, and ordinary ambiguity from rejection."],"if_true_action":"Address the specific interaction pattern directly—communication, pacing, initiation, repair, or finding better fit—without treating it as proof of global social undesirability.","uncertainty_strategy":"Prefer behavior over mind-reading; gather evidence across several interactions and allow ambiguous cases to remain ambiguous.","safety_gate":null,"professional_evaluation_triggers":[],"response_families":["behavioral_experiment","exposure_and_response_prevention","skills_and_feedback"]},{"id":3,"insecurity":"I'm incompetent / my work is bad.","core_belief":"Bad work or mistakes reveal that I am globally incompetent.","hidden_conditional":"If my work is weak, I do not deserve my role, confidence, or respect.","validation":"Sometimes work really is weak, and competence matters in many settings.","insecurity_voice":"What if the simplest explanation is the right one? Maybe the work looks bad because I am not good enough. Turning every failure into a 'learning opportunity' does not make the failure disappear.","maintenance_loop":["Set broad or high-stakes competence standard","Overprepare, avoid, or delay evaluation","Notice mistakes more than successes","Discount praise or success as luck","Translate specific weakness into global incompetence","Approach the next task with greater threat"],"best_question":"Which specific part of the work is weak, and what evidence would show improvement?","behavioral_experiment":{"prediction":"If my work is weak, I do not deserve my role, confidence, or respect.","action":"Submit or show a bounded piece of imperfect work and request specific, behavior-level feedback rather than a global judgment.","observable_outcomes":["Feedback is mixed rather than globally negative","Specific weaknesses improve with iteration","Others continue assigning responsibility or requesting work"],"time_horizon":"Use one bounded trial or a short predefined observation window; use longer repeated samples only when the predicted outcome itself unfolds over time.","stopping_rule":"Stop or redesign the experiment if it becomes unsafe, coercive, materially costly, or turns into repeated checking/reassurance rather than information gathering."},"disconfirming_evidence":["Feedback is mixed rather than globally negative","Specific weaknesses improve with iteration","Others continue assigning responsibility or requesting work"],"goal":"Turn competence from an identity verdict into a set of skills that can be measured and improved.","avoid_saying":[{"phrase":"You're brilliant.","reason":"Offers global reassurance that is easy to discount and can strengthen reassurance-seeking."},{"phrase":"Your work is amazing.","reason":"Targets the feeling with reassurance or a slogan rather than addressing the specific prediction, behavior, or maintenance loop."},{"phrase":"Everyone makes mistakes.","reason":"Makes an overbroad reassurance or denial that may be false and leaves the underlying mechanism untouched."}],"mechanisms":["avoidance","discounting_positive_evidence","global_self_judgment","perfectionism"],"related_insecurities":[7,8,10,11,12,15,20,31,55,85,87,88,99,100],"research_basis":["behavioral_experiments_and_practice","cognitive_behavioral","motivation_and_learning"],"pushbacks":[{"pushback":"What if my work actually is bad?","response":"Then that's useful information. Which part is bad?","move_type":"reframe_definition","move_note":"Replace global judgment with diagnosis."},{"pushback":"Everyone else seems better.","response":"At what specific task, measured how?","move_type":"operationalize_and_specify","move_note":"Operationalize comparison."},{"pushback":"I've failed before.","response":"Failures establish that some attempts failed. They don't establish a stable property called 'incompetent.'","move_type":"separate_or_deglobalize","move_note":"Block overgeneralization."},{"pushback":"If I stop criticizing myself I'll become mediocre.","response":"Critique the work aggressively. You don't need to critique the person producing it.","move_type":"standards_and_thresholds","move_note":"Preserve standards, remove self-attack."},{"pushback":"People compliment me because they're being nice.","response":"Then seek information harder to dismiss: blind evaluation, outcomes, repeat requests, objective tests.","move_type":"evidence_calibration","move_note":"Improve evidence quality."}],"provenance":{"origin":"thread-derived","source_ref":"v2.5:entry:3","generation_batch":"original_thread_distillation","content_version":"3.0"},"domains":["self_worth","status_and_achievement","work_and_competence"],"primary_domain":"work_and_competence","mechanism_details":["overgeneralization","discounting_positive_evidence","perfectionism","global_labeling","avoidance"],"research_basis_details":["CBT for low self-esteem","perfectionism-focused CBT","behavioral experiments","specific feedback"],"distinguish_from":[{"id":15,"difference":"Competence concerns can be accurate without deception; impostor fear specifically predicts illegitimate belonging or exposure."}],"evidence_concern_is_real":["Repeated, specific feedback identifies the same skill or performance gap.","Objective outcomes or role requirements show a consistent shortfall.","The pattern persists across comparable tasks rather than only under unusually difficult conditions."],"if_true_action":"Treat the supported part as a bounded skill or workflow problem: define the gap, get specific feedback, practice or redesign the work, and re-measure it without converting it into a global verdict.","uncertainty_strategy":"Use predefined performance criteria and repeated samples; avoid letting one success or failure settle the whole identity question.","safety_gate":null,"professional_evaluation_triggers":[],"response_families":["behavioral_experiment","skills_and_feedback"]},{"id":4,"insecurity":"I'm unlovable / a burden.","core_belief":"Knowing and loving me eventually becomes too costly for other people.","hidden_conditional":"If people see my needs, flaws, or full self, they will decide I am not worth the cost and leave.","validation":"Relationships really do involve costs, needs, conflict, and the possibility of loss.","insecurity_voice":"People like the manageable version of me. They have not seen the whole burden. If they knew how much work I really am, staying would stop making sense.","maintenance_loop":["Expect eventual rejection","Hide needs or vulnerable information","Seek reassurance but discount it","Avoid testing whether care survives real need","Feel unseen or distant","Interpret distance as evidence of being unlovable"],"best_question":"What specific thing do you believe someone could learn or be asked to carry that would make the relationship no longer worth it?","behavioral_experiment":{"prediction":"If people see my needs, flaws, or full self, they will decide I am not worth the cost and leave.","action":"With a trusted person, make one modest genuine request or disclose one bounded vulnerable fact, then observe behavior over time without immediately apologizing or seeking reassurance.","observable_outcomes":["People knowingly choose connection despite costs","Needs can be negotiated rather than triggering abandonment","Others initiate or sustain contact after seeing imperfection"],"time_horizon":"Use one bounded trial or a short predefined observation window; use longer repeated samples only when the predicted outcome itself unfolds over time.","stopping_rule":"Stop or redesign the experiment if it becomes unsafe, coercive, materially costly, or turns into repeated checking/reassurance rather than information gathering."},"disconfirming_evidence":["People knowingly choose connection despite costs","Needs can be negotiated rather than triggering abandonment","Others initiate or sustain contact after seeing imperfection"],"goal":"Make closeness testable and reciprocal rather than requiring proof of perfect lovability.","avoid_saying":[{"phrase":"Of course you're lovable.","reason":"Makes an overbroad reassurance or denial that may be false and leaves the underlying mechanism untouched."},{"phrase":"Anyone would be lucky to have you.","reason":"Offers global reassurance that is easy to discount and can strengthen reassurance-seeking."},{"phrase":"The right people will never leave.","reason":"Makes an overbroad reassurance or denial that may be false and leaves the underlying mechanism untouched."}],"mechanisms":["avoidance","conditional_self_worth","mind_reading","reassurance_seeking","rejection_sensitivity"],"related_insecurities":[1,6,14,17,20,21,22,23,24,25,27,28,30,37,46,47,73,78],"research_basis":["behavioral_experiments_and_practice","cognitive_behavioral","exposure_and_response_prevention","self_compassion"],"pushbacks":[{"pushback":"People don't know the real me.","response":"Then reassurance can't settle this. Let trusted people know slightly more of the thing you're hiding and observe what happens.","move_type":"behavioral_test","move_note":"Graduated vulnerability."},{"pushback":"If they knew everything, they'd leave.","response":"Nobody knows everything about anybody. What specific information are you predicting would change the relationship?","move_type":"operationalize_and_specify","move_note":"Make prophecy testable."},{"pushback":"People only reassure me because they're kind.","response":"Ignore the reassurance for a moment. What do they repeatedly choose to do?","move_type":"evidence_calibration","move_note":"Prefer behavior over words."},{"pushback":"My needs genuinely cost other people something.","response":"Yes. Relationships contain costs in both directions. 'Costs something' and 'not worth having' are very different claims.","move_type":"reframe_definition","move_note":"Reject hidden equivalence."},{"pushback":"People have left me before.","response":"That's evidence that particular relationships ended. What caused each one? 'Because I am intrinsically unlovable' is the broadest possible explanation.","move_type":"mechanism_analysis","move_note":"Seek narrower causal models."},{"pushback":"I don't want to risk finding out.","response":"That's the trap: avoiding closeness protects the belief from being disproved while also producing loneliness.","move_type":"mechanism_analysis","move_note":"Identify maintenance loop."}],"provenance":{"origin":"thread-derived","source_ref":"v2.5:entry:4","generation_batch":"original_thread_distillation","content_version":"3.0"},"domains":["friendship","romance_and_intimacy","self_worth","social_and_belonging"],"primary_domain":"social_and_belonging","mechanism_details":["rejection_sensitivity","mind_reading","avoidance_of_vulnerability","reassurance_discounting","conditional_worth"],"research_basis_details":["CBT for low self-esteem","behavioral experiments","self-compassion","interpersonal approaches"],"distinguish_from":[],"evidence_concern_is_real":["Multiple people independently give similar behavior-level feedback.","Observable patterns of withdrawal, nonresponse, conflict, or exclusion recur across contexts.","The concern remains after distinguishing fit, scheduling, bandwidth, and ordinary ambiguity from rejection."],"if_true_action":"Address the specific interaction pattern directly—communication, pacing, initiation, repair, or finding better fit—without treating it as proof of global social undesirability.","uncertainty_strategy":"Prefer behavior over mind-reading; gather evidence across several interactions and allow ambiguous cases to remain ambiguous.","safety_gate":null,"professional_evaluation_triggers":[],"response_families":["behavioral_experiment","exposure_and_response_prevention","self_compassion","skills_and_feedback"]},{"id":5,"insecurity":"My body / appearance is wrong.","core_belief":"My appearance determines whether I am acceptable, safe, or worthy.","hidden_conditional":"If my body or appearance is judged as wrong, I become less worthy or less acceptable to other people.","validation":"Appearance affects social experience, and dissatisfaction can attach to real features rather than imaginary ones.","insecurity_voice":"This is easy to intellectualize if you are not the one being looked at. People notice bodies. Appearance changes how people treat you. Telling me not to evaluate it does not stop that.","maintenance_loop":["Notice or anticipate appearance judgment","Check, compare, conceal, correct, or seek reassurance","Get brief relief","Return attention to appearance","Notice another defect or comparison","Treat renewed distress as proof the problem is urgent"],"best_question":"What do you predict will happen if the feature is noticed and you do not immediately check, correct, or hide it?","behavioral_experiment":{"prediction":"If my body or appearance is judged as wrong, I become less worthy or less acceptable to other people.","action":"Reduce one checking or comparison behavior for a fixed period and spend that time in a valued activity while observing what actually changes.","observable_outcomes":["Distress can rise and fall without checking","Others' behavior is less uniformly negative than predicted","Life participation can increase even before appearance judgment changes"],"time_horizon":"Use one bounded trial or a short predefined observation window; use longer repeated samples only when the predicted outcome itself unfolds over time.","stopping_rule":"Stop or redesign the experiment if it becomes unsafe, coercive, materially costly, or turns into repeated checking/reassurance rather than information gathering."},"disconfirming_evidence":["Distress can rise and fall without checking","Others' behavior is less uniformly negative than predicted","Life participation can increase even before appearance judgment changes"],"goal":"Reduce appearance-contingent worth and compulsive evaluation without requiring forced body positivity.","avoid_saying":[{"phrase":"You're beautiful.","reason":"Offers global reassurance that is easy to discount and can strengthen reassurance-seeking."},{"phrase":"Nobody notices that.","reason":"Makes an overbroad reassurance or denial that may be false and leaves the underlying mechanism untouched."},{"phrase":"Looks don't matter.","reason":"Targets the feeling with reassurance or a slogan rather than addressing the specific prediction, behavior, or maintenance loop."}],"mechanisms":["checking_monitoring","conditional_self_worth","reassurance_seeking","social_comparison"],"related_insecurities":[2,6,10,18,35,46,70,93],"research_basis":["cognitive_behavioral","exposure_and_response_prevention","self_compassion"],"pushbacks":[{"pushback":"But there really are things wrong with my appearance.","response":"You don't have to declare every feature beautiful. The question is how much of your life must be governed by evaluating it.","move_type":"reframe_definition","move_note":"Shift from verdict to investment."},{"pushback":"Other people notice.","response":"Probably some do. What are you predicting follows from their noticing?","move_type":"reframe_definition","move_note":"Expose hidden catastrophe."},{"pushback":"I need to keep checking so I know how I look.","response":"Does checking give you durable information, or temporary relief followed by another check?","move_type":"mechanism_analysis","move_note":"Identify reassurance/checking loop."},{"pushback":"I'd feel fine if I could just fix X.","response":"Maybe. It's worth noticing whether the threshold has moved after previous fixes.","move_type":"standards_and_thresholds","move_note":"Test moving-goalpost pattern."},{"pushback":"Accepting my body means pretending I like it.","response":"No. Acceptance can mean 'this is the body I have right now, and I don't need to adjudicate its worth every ten minutes.'","move_type":"grief_and_acceptance","move_note":"Acceptance is not approval."}],"provenance":{"origin":"thread-derived","source_ref":"v2.5:entry:5","generation_batch":"original_thread_distillation","content_version":"3.0"},"domains":["body_and_appearance","self_worth"],"primary_domain":"body_and_appearance","mechanism_details":["appearance_contingent_worth","checking","social_comparison","reassurance_seeking","attentional_bias"],"research_basis_details":["CBT for body-image disturbance","exposure and response prevention principles for checking","self-compassion and body image"],"distinguish_from":[],"evidence_concern_is_real":["The concern is tied to a specific, observable feature or functional limitation rather than an endlessly shifting global verdict.","Independent evidence shows a real practical consequence in a context where appearance or physical capacity matters.","The concern remains stable rather than moving to a new target after reassurance or correction."],"if_true_action":"Choose any change for practical or personally valued reasons, while keeping appearance or capability separate from total worth.","uncertainty_strategy":"Use bounded checking and functional criteria; do not use repeated comparison or reassurance as the decision rule.","safety_gate":null,"professional_evaluation_triggers":[],"response_families":["behavioral_experiment","exposure_and_response_prevention","self_compassion"]},{"id":6,"insecurity":"I'm boring / uninteresting / unremarkable.","core_belief":"I must be interesting or entertaining to deserve company.","hidden_conditional":"If I am quiet, ordinary, or have nothing impressive to offer, people will lose interest in me.","validation":"Some people do prefer highly expressive or entertaining company, and social fit is real.","insecurity_voice":"People say 'you don't have to perform,' but then they gravitate toward the funny, charismatic, accomplished people. If I stop producing interestingness, what exactly is left for them to choose?","maintenance_loop":["Compare self with charismatic or accomplished people","Try to perform interestingness","Monitor whether the performance lands","Feel artificial or depleted","Withdraw or speak less","Read reduced interaction as proof of being boring"],"best_question":"When you enjoy another person's company, how much of that enjoyment actually comes from them being impressive?","behavioral_experiment":{"prediction":"If I am quiet, ordinary, or have nothing impressive to offer, people will lose interest in me.","action":"Have one low-performance interaction centered on curiosity, shared activity, or comfortable silence rather than trying to be entertaining.","observable_outcomes":["Connection persists without constant novelty","Other people contribute to the interaction rather than requiring a performance","Quietness selects for compatible people rather than eliminating all connection"],"time_horizon":"Use one bounded trial or a short predefined observation window; use longer repeated samples only when the predicted outcome itself unfolds over time.","stopping_rule":"Stop or redesign the experiment if it becomes unsafe, coercive, materially costly, or turns into repeated checking/reassurance rather than information gathering."},"disconfirming_evidence":["Connection persists without constant novelty","Other people contribute to the interaction rather than requiring a performance","Quietness selects for compatible people rather than eliminating all connection"],"goal":"Separate connection from performance and admiration.","avoid_saying":[{"phrase":"You're not boring.","reason":"Offers global reassurance that is easy to discount and can strengthen reassurance-seeking."},{"phrase":"You're one of the most interesting people I know.","reason":"Offers global reassurance that is easy to discount and can strengthen reassurance-seeking."},{"phrase":"Just talk more.","reason":"Oversimplifies a maintained pattern as a simple choice and can add shame when the advice does not work."}],"mechanisms":["avoidance","conditional_self_worth","mind_reading","performance_anxiety","social_comparison"],"related_insecur ","Run the reality/safety gate","Address any concrete problem that is actually present","Identify the global conclusion","Make the feared prediction specific","Identify the maintenance loop","Choose the smallest tolerable and safe experiment","Observe what actually happens","Update the belief without making worth depend on the outcome"],he=["Research_basis fields name intervention families and mechanisms rather than prescribing clinical treatment.","Several insecurities can coexist with real limitations, rejection, poor performance, disability, or other constraints; the response should not deny those facts.","The common target is usually the global identity conclusion, rigid conditional self-worth, avoidance, or self-punishment layered on top of the underlying fact.","For severe distress or clinically significant symptoms, these response maps are not substitutes for individualized professional care."],pe={mechanisms:["adaptation","all_or_nothing_thinking","attachment_threat","authority_anxiety","avoidance","behavioral_feedback_loop","behavioral_reinforcement","catastrophizing","checking_monitoring","commodification_of_self","conditional_self_worth","control_seeking","decision_avoidance","dependency_fear","discounting_positive_evidence","emotion_moralization","executive_function_constraint","global_self_judgment","guilt","health_anxiety","hypervigilance","identity_fusion","identity_uncertainty","impostor_reasoning","impulsivity","indirect_communication","intolerance_of_uncertainty","learned_patterns","loss_aversion","maximization","mind_reading","moralization","mortality_salience","originality_anxiety","overcommitment","overresponsibility","people_pleasing","perfectionism","performance_anxiety","reassurance_seeking","rejection_sensitivity","relationship_coordination","rumination","scarcity_threat","self_criticism","self_discrepancy","shame","should_statements","skill_deficit","social_comparison","social_norm_threat","status_threat","suppression","trust_difficulty","unfalsifiable_standard","values_confusion","withdrawal"],research_basis:["acceptance_and_values","behavior_change_and_environment","behavioral_activation_and_learning","behavioral_experiments_and_practice","caregiving_stress","cognitive_behavioral","communication_and_assertiveness","conditional_self_worth_research","creativity_research","decision_science","emotion_regulation","exercise_and_physical_capability","expertise_and_epistemic_humility","exposure_and_response_prevention","financial_stress_and_scarcity","gratitude_and_savoring","grief_meaning_and_mortality","identity_and_self_concept","impostor_phenomenon","interpersonal_and_attachment","leadership_and_teamwork","moral_cognition_and_shame","motivation_and_learning","perfectionism","performance_anxiety_research","person_environment_fit","problem_solving_and_autonomy","prosociality_and_empathy","resilience_and_adaptation","self_compassion","self_control","self_monitoring_research","sexual_communication_and_performance","social_psychology","trust_deception_and_coercion","uncertainty_tolerance_research"],move_types:["action_orientation","behavioral_test","communication_and_boundaries","cost_benefit","environmental_design","evidence_calibration","grief_and_acceptance","mechanism_analysis","moral_deglobalization","operationalize_and_specify","reframe_definition","relationship_coordination","separate_or_deglobalize","skills_practice","standards_and_thresholds","status_deglobalization","strategy_adjustment","symmetry_test","uncertainty_tolerance","values_clarification"],domains:["body_and_appearance","change_and_resilience","emotion_regulation","family_and_caregiving","friendship","health_and_cognition","identity_and_authenticity","meaning_and_mortality","money_and_resources","romance_and_intimacy","self_regulation_and_habits","self_worth","social_and_belonging","status_and_achievement","trust_and_safety","work_and_competence"]},x={description:re,insecurities:se,schema_version:ce,response_principles:le,response_sequence:de,research_notes:he,controlled_vocabularies:pe},me=`<h1>Psychological basis of the Insecure Responses database</h1>
<p>The <em>Insecure Responses</em> database is not based on a single theory of insecurity, nor are its 100 entries individually validated psychological treatments. It is a <strong>psychologically informed synthesis</strong> of ideas from cognitive-behavioral therapy (CBT), social and personality psychology, behavioral science, Acceptance and Commitment Therapy (ACT), self-compassion research, and research on processes such as perfectionism, rejection sensitivity, rumination, safety behaviors, reassurance seeking, and intolerance of uncertainty.</p>
<p>Its central working assumption is that an insecurity may contain a <strong>real observation or legitimate concern</strong> while also being maintained by additional processes: global self-judgment, conditional self-worth, avoidance, reassurance seeking, checking, perfectionistic standards, social comparison, rumination, or attempts to obtain impossible certainty.</p>
<p>The resulting response style therefore does not begin by assuming that the feared belief is false. It asks:</p>
<ol>
<li>What part of the concern is actually supported by evidence?</li>
<li>What broader conclusion about the self is being drawn from it?</li>
<li>What behavior or reasoning process may be keeping that conclusion from updating?</li>
<li>What evidence would genuinely distinguish competing explanations?</li>
<li>If the feared condition is real, what concrete action, accommodation, repair, or decision follows?</li>
<li>What uncertainty remains even after reasonable action has been taken?</li>
</ol>
<p>This produces the recurring structure in the database:</p>
<blockquote>
<p><strong>observation or fear → core belief → conditional rule → maintenance loop → specific prediction → bounded experiment or action → belief update</strong></p>
</blockquote>
<p>That structure has recognizable precedents in CBT and related research, but the particular mapping of those ideas onto the database&#39;s individual insecurity entries is an extrapolation rather than a separately tested clinical protocol.</p>
<hr>
<h2>How to interpret the evidence</h2>
<p>The references below do not all provide the same kind of evidence. The database draws on several levels:</p>
<ul>
<li><strong>Conceptual or clinical models</strong> propose mechanisms and organize observations. They can be highly useful without independently establishing that every proposed mechanism is causal.</li>
<li><strong>Experimental and mechanism studies</strong> test narrower claims, such as whether a particular intervention changes a belief or whether a proposed process covaries with improvement.</li>
<li><strong>Randomized treatment trials</strong> test whole interventions or components in defined populations.</li>
<li><strong>Systematic reviews and meta-analyses</strong> synthesize multiple studies and generally provide stronger evidence for average treatment effects, while still inheriting limitations of the underlying studies.</li>
<li><strong>Clinical methods texts</strong> describe how techniques are used but should not be mistaken for independent evidence that the techniques outperform alternatives.</li>
</ul>
<p>These categories are not interchangeable. A theory that explains the database&#39;s structure is not automatically evidence that every response generated from that theory is effective, and a meta-analysis showing that CBT or ACT helps a clinical population does not validate every sentence in this database.</p>
<hr>
<h2>Cognitive formulation: observations, rules, and global beliefs</h2>
<p>A major influence is the cognitive-behavioral tradition, particularly cognitive models of low self-esteem.</p>
<p>Fennell&#39;s cognitive model of low self-esteem distinguishes broad negative beliefs about the self from the assumptions and rules people develop around them. A global belief such as <em>“I am inadequate”</em> may generate rules such as <em>“If I never make a mistake, no one will discover that I am inadequate.”</em> Behaviors organized around those rules can reduce threat in the short term while preventing the deeper belief from being fairly tested.</p>
<p>This is primarily a <strong>conceptual and clinical formulation</strong>, not by itself proof that every component is causal. Later work provides some treatment-level support: Kolubinski and colleagues&#39; systematic review and meta-analysis examined CBT interventions explicitly based on the Fennell model. Only eight studies met inclusion criteria, seven entered the quantitative synthesis, so the evidence was promising but still limited in size and did not establish the unique necessity of every element of the model.</p>
<p>This lineage motivates database fields such as <strong>core belief</strong>, <strong>hidden conditional</strong>, and <strong>maintenance loop</strong>. A statement such as <em>“my work is bad”</em> is treated differently from <em>“therefore I am globally incompetent.”</em> Likewise, <em>“some people dislike me”</em> differs from <em>“therefore I am fundamentally unlikable.”</em> The response can concede the local proposition while examining whether the global identity conclusion follows.</p>
<p><strong>Key sources</strong></p>
<ul>
<li><p>Fennell, M. J. V. (1997). <em>Low self-esteem: A cognitive perspective</em>. Behavioural and Cognitive Psychotherapy, 25(1), 1–26. DOI: 10.1017/S1352465800015368.<br><a href="https://doi.org/10.1017/S1352465800015368">Publisher record</a><br><strong>Used here for:</strong> the conceptual architecture linking global self-beliefs, conditional assumptions, compensatory rules, and maintenance processes.</p>
</li>
<li><p>Kolubinski, D. C., Frings, D., Nikčević, A. V., Lawrence, J. A., &amp; Spada, M. M. (2018). <em>A systematic review and meta-analysis of CBT interventions based on the Fennell model of low self-esteem</em>. Psychiatry Research, 267, 296–305. DOI: 10.1016/j.psychres.2018.06.025.<br><a href="https://pubmed.ncbi.nlm.nih.gov/30201116/">PubMed abstract</a><br><strong>Used here for:</strong> limited but direct treatment-level evidence concerning CBT interventions derived from the Fennell model.</p>
</li>
</ul>
<hr>
<h2>Conditional self-worth and contingent domains</h2>
<p>Many database entries are better understood as problems of <strong>contingent self-worth</strong> than simply “low self-esteem.”</p>
<p>Crocker and Wolfe proposed that people differ in the domains on which they stake their self-worth. Success and failure in highly contingent domains can produce corresponding changes in self-esteem. Intelligence, productivity, attractiveness, morality, usefulness, achievement, approval, and status can all become domains in which an ordinary setback acquires disproportionate identity significance.</p>
<p>This supports a central distinction in the database:</p>
<blockquote>
<p>A domain may matter greatly without being entitled to determine the value of the whole person.</p>
</blockquote>
<p>The theory is particularly relevant to insecurities such as <em>“I&#39;m not smart enough,” “I&#39;m not useful enough,” “my status is too low,” “I&#39;m not attractive enough,”</em> and <em>“I&#39;m wasting my potential.”</em></p>
<ul>
<li>Crocker, J., &amp; Wolfe, C. T. (2001). <em>Contingencies of self-worth</em>. Psychological Review, 108(3), 593–623. DOI: 10.1037/0033-295X.108.3.593.<br><a href="https://pubmed.ncbi.nlm.nih.gov/11488379/">PubMed abstract</a><br><strong>Used here for:</strong> the concept that self-esteem can become dependent on success or failure in particular personally important domains.</li>
</ul>
<hr>
<h2>Ideal selves, “ought” selves, and self-discrepancy</h2>
<p>Some insecurities compare the present person not to an ordinary external standard but to an imagined self: who they <em>could</em> have been, <em>should</em> be, or believe they are obligated to become.</p>
<p>Higgins&#39;s self-discrepancy theory distinguishes representations of the actual self, ideal self, and ought self. The theory links different forms of discrepancy to different forms of negative affect. This is useful for understanding why statements such as <em>“I&#39;m wasting my potential,” “I&#39;m behind,”</em> or <em>“I&#39;m not what I should be”</em> can persist even when conventional achievements are present: the reference point is an internal counterfactual or obligation.</p>
<p>The database uses this theory as a <strong>conceptual framework</strong>, not as evidence that every painful discrepancy is distorted or should be removed.</p>
<ul>
<li>Higgins, E. T. (1987). <em>Self-discrepancy: A theory relating self and affect</em>. Psychological Review, 94(3), 319–340. DOI: 10.1037/0033-295X.94.3.319.<br><a href="https://pubmed.ncbi.nlm.nih.gov/3615707/">PubMed record</a><br><strong>Used here for:</strong> distinguishing actual-self concerns from ideal-self and ought-self standards.</li>
</ul>
<hr>
<h2>Perfectionism and moving standards</h2>
<p>Shafran, Cooper, and Fairburn&#39;s cognitive-behavioral account of clinical perfectionism is especially relevant to entries in which self-evaluation depends heavily on meeting demanding standards.</p>
<p>The proposed maintenance pattern is asymmetric: failure can generate harsh self-criticism, while success may be discounted, attributed to excessive effort, or followed by raising the standard. This creates a system in which the criterion for adequacy remains difficult to satisfy permanently.</p>
<p>That model motivates database responses such as:</p>
<ul>
<li>preserve standards that improve outcomes;</li>
<li>identify which part of the standard is actually functional;</li>
<li>separate criticism of work from condemnation of the person;</li>
<li>test “good enough” performance at low stakes;</li>
<li>notice whether success causes the threshold to move.</li>
</ul>
<p>The Shafran et al. paper is principally a <strong>cognitive-behavioral analysis/model</strong>, so the database should not present every inferred perfectionism loop as experimentally proven.</p>
<ul>
<li>Shafran, R., Cooper, Z., &amp; Fairburn, C. G. (2002). <em>Clinical perfectionism: A cognitive-behavioural analysis</em>. Behaviour Research and Therapy, 40(7), 773–791. DOI: 10.1016/S0005-7967(01)00059-6.<br><a href="https://pubmed.ncbi.nlm.nih.gov/12074372/">PubMed abstract</a><br><strong>Used here for:</strong> the model of self-evaluation becoming excessively dependent on demanding standards and for characteristic perfectionistic maintenance processes.</li>
</ul>
<hr>
<h2>Maintenance mechanisms rather than argument alone</h2>
<p>The database emphasizes <strong>what keeps a belief stable</strong>, not merely why it may have originated.</p>
<p>Avoidance is the clearest example. Avoidance reduces immediate distress but can also remove opportunities to learn whether the feared outcome would have occurred. Safety behaviors can operate similarly.</p>
<p>In social anxiety, safety behaviors are used to reduce perceived social threat. Piccirillo, Dryman, and Heimberg&#39;s review describes evidence and theory suggesting that such behaviors can prevent people from gathering information that would disconfirm feared social beliefs, thereby helping maintain anxiety.</p>
<p>The database generalizes this <strong>mechanistic pattern cautiously</strong> to other contexts: overrehearsing, compulsive impression management, hiding needs, repeated reassurance seeking, repeated checking, perfectionistic overpreparation, or refusing action without guarantees may sometimes protect a belief from updating.</p>
<p>That generalization is a synthesis; evidence from social anxiety should not be treated as direct experimental proof for every analogous behavior in other domains.</p>
<ul>
<li>Piccirillo, M. L., Dryman, M. T., &amp; Heimberg, R. G. (2016). <em>Safety behaviors in adults with social anxiety: Review and future directions</em>. Behavior Therapy, 47(5), 675–687. DOI: 10.1016/j.beth.2015.11.005.<br><a href="https://pubmed.ncbi.nlm.nih.gov/27816080/">PubMed abstract</a><br><strong>Used here for:</strong> the idea that protective behaviors can sometimes maintain feared beliefs by preventing collection of disconfirming evidence.</li>
</ul>
<hr>
<h2>Behavioral experiments: experience as evidence</h2>
<p>A major CBT influence is the use of <strong>behavioral experiments</strong>.</p>
<p>Bennett-Levy and colleagues&#39; <em>Oxford Guide to Behavioural Experiments in Cognitive Therapy</em> is a clinical methods source describing how cognitive therapy converts beliefs into experiential tests. It is important as a <strong>methodological foundation</strong>, but it should not be cited as though the book itself were an outcome trial proving that behavioral experiments outperform other techniques.</p>
<p>Direct experimental evidence is narrower. McManus, Van Doorn, and Yiend randomized nonclinical participants to behavioral experiments, thought records, or control procedures. Both active techniques produced belief change relative to control, with some evidence favoring behavioral experiments. This supports the idea that deliberately testing beliefs can change them, but it does not establish a universal advantage.</p>
<p>A more recent randomized dismantling trial in social anxiety compared cognitive therapy emphasizing behavioral experiments with a version relying more heavily on verbal interventions. Yilmaz and colleagues (2025) found no statistically significant between-group difference on the primary social-anxiety outcome at post-treatment, although effect sizes favored behavioral experiments and later emotion-regulation outcomes favored that condition. This is useful precisely because it argues against overclaiming: behavioral experiments are plausible and often clinically useful, but their incremental advantage over other competent cognitive interventions is not settled in every setting.</p>
<p>The database therefore uses behavioral experiments as <strong>bounded information-gathering procedures</strong>, not as rituals that must prove the person worthy or prove the insecurity false.</p>
<p>Useful experiments specify:</p>
<ul>
<li>a prediction;</li>
<li>a bounded action;</li>
<li>observable outcomes;</li>
<li>a time horizon;</li>
<li>a stopping rule.</li>
</ul>
<p>Stopping rules matter because repeated “experimentation” can become checking or reassurance seeking.</p>
<p><strong>Key sources</strong></p>
<ul>
<li><p>Bennett-Levy, J., Butler, G., Fennell, M., Hackmann, A., Mueller, M., &amp; Westbrook, D. (Eds.). (2004). <em>Oxford Guide to Behavioural Experiments in Cognitive Therapy</em>. Oxford University Press. DOI: 10.1093/med:psych/9780198529163.001.0001.<br><a href="https://academic.oup.com/book/1220">Oxford Academic record</a><br><strong>Used here for:</strong> the clinical methodology and rationale of behavioral experiments.</p>
</li>
<li><p>McManus, F., Van Doorn, K., &amp; Yiend, J. (2012). <em>Examining the effects of thought records and behavioral experiments in instigating belief change</em>. Journal of Behavior Therapy and Experimental Psychiatry, 43(1), 540–547. DOI: 10.1016/j.jbtep.2011.07.003.<br><a href="https://pubmed.ncbi.nlm.nih.gov/21819813/">PubMed abstract</a><br><strong>Used here for:</strong> experimental evidence that structured cognitive/behavioral procedures can change targeted beliefs, with some evidence favoring behavioral experiments.</p>
</li>
<li><p>Yilmaz, C., Nemani, A., Schittenhelm, J., Clark, D. M., Thew, G., &amp; Stangier, U. (2025). <em>Behavioral experiments vs. verbal interventions in cognitive therapy for social anxiety disorder: A randomized controlled trial</em>. Behaviour Research and Therapy, 193, 104825. DOI: 10.1016/j.brat.2025.104825.<br><a href="https://pubmed.ncbi.nlm.nih.gov/40753820/">PubMed abstract</a><br><strong>Used here for:</strong> contemporary evidence that behavioral experiments may add value, while also showing that their incremental superiority over verbal cognitive interventions is not unequivocally established.</p>
</li>
</ul>
<hr>
<h2>Rumination versus productive analysis</h2>
<p>The database often responds to repetitive global judgments by converting them into narrower questions, decisions, or observable tests.</p>
<p>This is partly motivated by research on <strong>rumination</strong>. Nolen-Hoeksema, Wisco, and Lyubomirsky reviewed evidence associating rumination with intensified negative thinking, impaired problem solving, interference with instrumental behavior, erosion of social support, and several forms of psychopathology.</p>
<p>This does not mean sustained thought is inherently maladaptive. The relevant distinction is between thought that generates information or action and repetitive thought that repeatedly recreates the same negative conclusion without changing the decision state.</p>
<ul>
<li>Nolen-Hoeksema, S., Wisco, B. E., &amp; Lyubomirsky, S. (2008). <em>Rethinking rumination</em>. Perspectives on Psychological Science, 3(5), 400–424. DOI: 10.1111/j.1745-6924.2008.00088.x.<br><a href="https://pubmed.ncbi.nlm.nih.gov/26158958/">PubMed abstract</a><br><strong>Used here for:</strong> the distinction between repetitive negative thought and more adaptive reflection, and for evidence concerning adverse consequences of rumination.</li>
</ul>
<hr>
<h2>Self-compassion without abandoning improvement</h2>
<p>Another recurring principle is that <strong>reducing self-punishment does not require abandoning standards or responsibility</strong>.</p>
<p>Neff&#39;s foundational account conceptualizes self-compassion in terms of self-kindness rather than harsh self-judgment, common humanity rather than isolation, and balanced awareness rather than overidentification. This is primarily a <strong>conceptualization of the construct</strong>.</p>
<p>Breines and Chen provide more direct experimental evidence relevant to the database&#39;s motivational claim. Across four experiments, inducing or encouraging self-compassion after failure or wrongdoing was associated with greater motivation to improve, study, or make amends.</p>
<p>The appropriate inference is modest:</p>
<blockquote>
<p>Self-compassion <strong>can support self-improvement motivation</strong> and does not necessarily produce complacency.</p>
</blockquote>
<p>That is stronger than merely asserting that harshness is bad, but weaker than claiming that self-compassion universally improves motivation in every population and setting.</p>
<p><strong>Key sources</strong></p>
<ul>
<li><p>Neff, K. D. (2003). <em>Self-compassion: An alternative conceptualization of a healthy attitude toward oneself</em>. Self and Identity, 2(2), 85–101. DOI: 10.1080/15298860309032.<br><a href="https://doi.org/10.1080/15298860309032">Publisher record</a><br><strong>Used here for:</strong> the conceptual definition of self-compassion.</p>
</li>
<li><p>Breines, J. G., &amp; Chen, S. (2012). <em>Self-compassion increases self-improvement motivation</em>. Personality and Social Psychology Bulletin, 38(9), 1133–1143. DOI: 10.1177/0146167212445599.<br><a href="https://pubmed.ncbi.nlm.nih.gov/22645164/">PubMed abstract</a><br><strong>Used here for:</strong> experimental evidence that self-compassion can coexist with, and in some contexts increase, motivation to improve after failure or wrongdoing.</p>
</li>
</ul>
<hr>
<h2>Acceptance, values, and psychological flexibility</h2>
<p>The database also incorporates ideas associated with Acceptance and Commitment Therapy (ACT), particularly when the problem contains an impossible control requirement: eliminating uncertainty, guaranteeing approval, eradicating difficult feelings, or proving that a life choice can never be regretted.</p>
<p>Hayes and colleagues&#39; 2006 paper is best treated as a <strong>statement and synthesis of the ACT model</strong>, including the proposed construct of psychological flexibility. The authors themselves described the outcome evidence available at that time as not yet mature enough to support strong comparative claims.</p>
<p>A-Tjak and colleagues&#39; later meta-analysis provides stronger efficacy evidence. Across 39 randomized controlled trials, ACT performed better than several control conditions but did not significantly outperform established treatments such as CBT overall. Thus the database can reasonably draw on ACT processes without claiming that ACT is uniquely superior.</p>
<p>More recent mechanism research strengthens—but does not make definitive—the psychological-flexibility account. Macri and Rogge&#39;s 2024 systematic and meta-analytic review found that ACT interventions improved measures of flexibility/inflexibility and that improvements in those processes were associated with reductions in distress. Methodological features moderated some results, so mediation and causal-mechanism claims still require care.</p>
<p>The database consequently uses acceptance in a specific sense:</p>
<blockquote>
<p>Stop demanding control over what cannot be guaranteed, while retaining agency over actions, values, safeguards, and decisions.</p>
</blockquote>
<p>Acceptance is not resignation and does not imply approving of harmful circumstances.</p>
<p><strong>Key sources</strong></p>
<ul>
<li><p>Hayes, S. C., Luoma, J. B., Bond, F. W., Masuda, A., &amp; Lillis, J. (2006). <em>Acceptance and commitment therapy: Model, processes and outcomes</em>. Behaviour Research and Therapy, 44(1), 1–25. DOI: 10.1016/j.brat.2005.06.006.<br><a href="https://pubmed.ncbi.nlm.nih.gov/16300724/">PubMed abstract</a><br><strong>Used here for:</strong> the ACT model and proposed processes, particularly psychological flexibility, acceptance, values, and committed action.</p>
</li>
<li><p>A-Tjak, J. G. L., Davis, M. L., Morina, N., Powers, M. B., Smits, J. A. J., &amp; Emmelkamp, P. M. G. (2015). <em>A meta-analysis of the efficacy of acceptance and commitment therapy for clinically relevant mental and physical health problems</em>. Psychotherapy and Psychosomatics, 84(1), 30–36. DOI: 10.1159/000365764.<br><a href="https://pubmed.ncbi.nlm.nih.gov/25547522/">PubMed abstract</a><br><strong>Used here for:</strong> treatment-level evidence for ACT, while supporting the more conservative conclusion that ACT is effective relative to controls but not clearly superior to established treatments overall.</p>
</li>
<li><p>Macri, J. A., &amp; Rogge, R. D. (2024). <em>Examining domains of psychological flexibility and inflexibility as treatment mechanisms in acceptance and commitment therapy: A comprehensive systematic and meta-analytic review</em>. Clinical Psychology Review, 110, 102432. DOI: 10.1016/j.cpr.2024.102432.<br><a href="https://pubmed.ncbi.nlm.nih.gov/38615492/">PubMed abstract</a><br><strong>Used here for:</strong> evidence that changes in psychological flexibility/inflexibility are associated with changes in distress during ACT, while retaining caution about causal mediation.</p>
</li>
</ul>
<hr>
<h2>Intolerance of uncertainty</h2>
<p>Many insecurities contain a hidden requirement for certainty:</p>
<ul>
<li>certainty that another person approves;</li>
<li>certainty that a relationship will last;</li>
<li>certainty that one&#39;s health is safe;</li>
<li>certainty that a decision is optimal;</li>
<li>certainty that a mistake will not occur;</li>
<li>certainty that a future self will not regret the present choice.</li>
</ul>
<p>Research on <strong>intolerance of uncertainty (IU)</strong> provides a useful transdiagnostic framework for understanding this pattern.</p>
<p>Shihata and colleagues review evidence supporting IU as a transdiagnostic risk and maintaining factor across emotional disorders while emphasizing that important theoretical and empirical questions remain unresolved. The database therefore uses careful wording: the literature <strong>supports or suggests</strong> a transdiagnostic role for intolerance of uncertainty; it does not eliminate uncertainty about the construct itself.</p>
<p>This motivates replacing impossible certainty demands with:</p>
<ol>
<li>reasonable decision thresholds;</li>
<li>proportionate safeguards;</li>
<li>explicit stopping rules;</li>
<li>tolerance for the residual uncertainty that no amount of checking can remove.</li>
</ol>
<ul>
<li>Shihata, S., McEvoy, P. M., Mullan, B. A., &amp; Carleton, R. N. (2016). <em>Intolerance of uncertainty in emotional disorders: What uncertainties remain?</em> Journal of Anxiety Disorders, 41, 115–124. DOI: 10.1016/j.janxdis.2016.05.001.<br><a href="https://pubmed.ncbi.nlm.nih.gov/27212227/">PubMed abstract</a><br><strong>Used here for:</strong> the transdiagnostic intolerance-of-uncertainty framework and, equally importantly, its evidential limitations.</li>
</ul>
<hr>
<h2>Health anxiety: reasonable care versus attempts at certainty</h2>
<p>Health-related entries require special care because bodily symptoms can represent genuine medical problems.</p>
<p>Cooper and colleagues&#39; systematic review and meta-analysis supports CBT as an effective treatment for health anxiety. That evidence concerns <strong>treatment efficacy</strong>, not by itself the specific claim that reassurance and checking are maintaining mechanisms.</p>
<p>For that mechanism, an older paper by Salkovskis and Warwick explicitly proposed reassurance seeking and bodily checking as avoidance/safety behaviors that can maintain health anxiety. The paper also reported two single-case experiments consistent with the model. Because this is a small and early evidence base, it should be cited as a <strong>mechanistic clinical model with limited experimental evidence</strong>, not definitive proof.</p>
<p>Accordingly, the database should never translate “reduce checking” into “ignore symptoms.” Its intended sequence is:</p>
<ol>
<li>identify whether medical evaluation or monitoring is reasonably indicated;</li>
<li>follow appropriate health guidance;</li>
<li>distinguish that action from additional checking whose primary function is to achieve certainty;</li>
<li>use explicit escalation thresholds and stopping rules.</li>
</ol>
<p><strong>Key sources</strong></p>
<ul>
<li><p>Cooper, K., Gregory, J. D., Walker, I., Lambe, S., &amp; Salkovskis, P. M. (2017). <em>Cognitive Behaviour Therapy for Health Anxiety: A Systematic Review and Meta-Analysis</em>. Behavioural and Cognitive Psychotherapy, 45(2), 110–123. DOI: 10.1017/S1352465816000527.<br><a href="https://pubmed.ncbi.nlm.nih.gov/28229805/">PubMed abstract</a><br><strong>Used here for:</strong> evidence that CBT can reduce health anxiety.</p>
</li>
<li><p>Salkovskis, P. M., &amp; Warwick, H. M. C. (1986). <em>Morbid preoccupations, health anxiety and reassurance: A cognitive-behavioural approach to hypochondriasis</em>. Behaviour Research and Therapy, 24(5), 597–602. DOI: 10.1016/0005-7967(86)90041-0.<br><a href="https://doi.org/10.1016/0005-7967(86)90041-0">Publisher abstract</a><br><strong>Used here for:</strong> the early cognitive-behavioral proposal that reassurance seeking and bodily checking can maintain health anxiety; evidence in the paper is limited partly to two single-case experiments.</p>
</li>
</ul>
<hr>
<h2>Rejection sensitivity and interpersonal feedback loops</h2>
<p>Social insecurities can become partly self-maintaining.</p>
<p>Downey and Feldman&#39;s work on rejection sensitivity characterizes a disposition to anxiously expect, readily perceive, and strongly react to rejection. Their studies link rejection sensitivity with consequential patterns in intimate relationships.</p>
<p>This provides one model for database loops such as:</p>
<blockquote>
<p>expect rejection → conceal or test → interpret ambiguity negatively → withdraw or react defensively → create more difficult interaction → treat resulting distance as confirmation</p>
</blockquote>
<p>The database should not assume that every rejection is imagined. Rejection sensitivity is useful precisely because it distinguishes <strong>the occurrence of rejection</strong> from <strong>expectations, interpretations, and reactions that may alter its probability or perceived meaning</strong>.</p>
<ul>
<li>Downey, G., &amp; Feldman, S. I. (1996). <em>Implications of rejection sensitivity for intimate relationships</em>. Journal of Personality and Social Psychology, 70(6), 1327–1343. DOI: 10.1037/0022-3514.70.6.1327.<br><a href="https://pubmed.ncbi.nlm.nih.gov/8667172/">PubMed abstract</a><br><strong>Used here for:</strong> the rejection-sensitivity construct and interpersonal feedback loops involving expectations of rejection.</li>
</ul>
<hr>
<h2>Self-efficacy, mastery, and specific capability beliefs</h2>
<p>The database tries to convert broad trait verdicts such as <em>“I&#39;m incapable,” “I&#39;m undisciplined,”</em> or <em>“I can never do this”</em> into more specific questions about tasks, conditions, skills, and supports.</p>
<p>Bandura&#39;s self-efficacy theory is relevant here. Self-efficacy concerns beliefs about one&#39;s capacity to perform behaviors necessary to produce outcomes, with mastery experiences playing a central role in efficacy expectations.</p>
<p>The database does <strong>not</strong> use this as evidence that confidence alone creates competence. Rather, it supports treating capability beliefs as specific, revisable, and partly responsive to actual experience.</p>
<ul>
<li>Bandura, A. (1977). <em>Self-efficacy: Toward a unifying theory of behavioral change</em>. Psychological Review, 84(2), 191–215. DOI: 10.1037/0033-295X.84.2.191.<br><a href="https://doi.org/10.1037/0033-295X.84.2.191">Publisher record</a><br><strong>Used here for:</strong> specific efficacy beliefs, mastery experience, and persistence rather than fixed global capability labels.</li>
</ul>
<hr>
<h2>From intention to action: implementation intentions</h2>
<p>Some database entries concern an <strong>intention–action gap</strong>: the person knows what they want to do but repeatedly fails to initiate or sustain it.</p>
<p>Gollwitzer&#39;s work on implementation intentions proposes linking a recognizable situation to a specified action in an “if X, then Y” format. This shifts part of action initiation from an in-the-moment deliberative process to a prepared cue-response relation.</p>
<p>Gollwitzer&#39;s 1999 paper provides the theoretical account. Stronger aggregate evidence comes from Gollwitzer and Sheeran&#39;s 2006 meta-analysis of 94 independent tests, which reported a medium-to-large average effect on goal attainment (<code>d = .65</code>) and evidence for proposed processes involving cue accessibility and action initiation.</p>
<p>This supports database responses that replace <em>“I should have more discipline”</em> with questions such as <em>“What cue predicts failure to start?”</em> and <em>“What action should occur when that cue appears?”</em></p>
<p>It does not justify explaining every self-regulation problem with implementation intentions; structural barriers, exhaustion, competing incentives, skill deficits, health, environment, and other mechanisms may dominate.</p>
<p><strong>Key sources</strong></p>
<ul>
<li><p>Gollwitzer, P. M. (1999). <em>Implementation intentions: Strong effects of simple plans</em>. American Psychologist, 54(7), 493–503. DOI: 10.1037/0003-066X.54.7.493.<br><a href="https://doi.org/10.1037/0003-066X.54.7.493">Publisher record</a><br><strong>Used here for:</strong> the theoretical formulation of implementation intentions and cue-linked if/then planning.</p>
</li>
<li><p>Gollwitzer, P. M., &amp; Sheeran, P. (2006). <em>Implementation intentions and goal achievement: A meta-analysis of effects and processes</em>. Advances in Experimental Social Psychology, 38, 69–119. DOI: 10.1016/S0065-2601(06)38002-1.<br><a href="https://doi.org/10.1016/S0065-2601(06)38002-1">Publisher abstract</a><br><strong>Used here for:</strong> meta-analytic evidence that implementation intentions improve goal attainment across many studies, while quantifying the average rather than assuming universal effectiveness.</p>
</li>
</ul>
<hr>
<h2>Broad evidence for CBT</h2>
<p>The database is heavily CBT-informed, but broad evidence that CBT is efficacious should not be confused with evidence for any one database entry.</p>
<p>Hofmann and colleagues reviewed meta-analyses of CBT across multiple conditions and found a substantial evidence base, particularly for several anxiety and stress-related problems, among others. This justifies describing many database techniques as deriving from a well-studied therapeutic tradition.</p>
<p>It does <strong>not</strong> validate:</p>
<ul>
<li><p>the database as a diagnostic system;</p>
</li>
<li><p>its specific taxonomy;</p>
</li>
<li><p>its 100 individual formulations;</p>
</li>
<li><p>the exact wording of its responses;</p>
</li>
<li><p>the assumption that CBT-derived techniques are always the best response.</p>
</li>
<li><p>Hofmann, S. G., Asnaani, A., Vonk, I. J. J., Sawyer, A. T., &amp; Fang, A. (2012). <em>The efficacy of cognitive behavioral therapy: A review of meta-analyses</em>. Cognitive Therapy and Research, 36, 427–440. DOI: 10.1007/s10608-012-9476-1.<br><a href="https://pubmed.ncbi.nlm.nih.gov/23459093/">PubMed abstract</a><br><strong>Used here for:</strong> broad evidence that CBT is an empirically studied and often effective intervention family, not for direct validation of the database itself.</p>
</li>
</ul>
<hr>
<h2>What the research does and does not support</h2>
<p>The research base supports several general design choices in the database:</p>
<ul>
<li>distinguish specific observations from global identity conclusions;</li>
<li>make hidden conditional rules explicit;</li>
<li>examine behaviors that may prevent beliefs from updating;</li>
<li>convert vague predictions into observable ones;</li>
<li>use bounded behavioral tests where safe;</li>
<li>reduce repetitive checking or reassurance when its primary function is obtaining certainty;</li>
<li>preserve useful standards while questioning self-punishment;</li>
<li>distinguish rumination from decision-relevant analysis;</li>
<li>use values and chosen action when certainty is impossible;</li>
<li>treat self-regulation difficulties as potentially mechanism-specific rather than automatically moral failures;</li>
<li>allow the possibility that the feared condition is actually true and may require practical action.</li>
</ul>
<p>The literature does <strong>not</strong> establish that every insecurity has one correct hidden belief, one maintenance loop, or one appropriate experiment. Different people can arrive at superficially similar statements through different mechanisms.</p>
<p>For example, <em>“I&#39;m going to end up isolated”</em> might reflect rejection sensitivity and avoidance in one person, an objectively shrinking social network in another, hostile behavior in a third, geographic isolation in a fourth, or some combination. A psychologically informed response should discriminate among these possibilities rather than forcing the person into a favored theory.</p>
<hr>
<h2>Safety and reality testing</h2>
<p>The database&#39;s later schema includes a reality/safety gate for a reason.</p>
<p>Some apparent “insecurities” concern conditions where false reassurance or indiscriminate exposure would be inappropriate:</p>
<ul>
<li>medical symptoms;</li>
<li>suspected cognitive decline;</li>
<li>exploitation or coercion;</li>
<li>dangerous anger or loss of behavioral control;</li>
<li>financial precarity;</li>
<li>abusive relationships;</li>
<li>other situations involving material risk.</li>
</ul>
<p>In these domains the psychological task is <strong>not</strong> to persuade the person that the danger is imaginary. The sequence should instead be:</p>
<ol>
<li>assess whether the concern calls for medical, legal, safety, financial, interpersonal, or other practical action;</li>
<li>take proportionate action;</li>
<li>distinguish reasonable precautions from attempts to eliminate all uncertainty;</li>
<li>address the identity judgment or maintenance mechanism only after the material problem has been taken seriously.</li>
</ol>
<p>This is one reason the database distinguishes <code>evidence_concern_is_real</code>, <code>if_true_action</code>, <code>uncertainty_strategy</code>, <code>safety_gate</code>, and <code>professional_evaluation_triggers</code>.</p>
<hr>
<h2>Scope and limitations</h2>
<p>The <em>Insecure Responses</em> database should be understood as a <strong>psychologically informed response framework</strong>, not as:</p>
<ul>
<li>a diagnostic instrument;</li>
<li>a replacement for individualized psychotherapy;</li>
<li>a clinical decision rule;</li>
<li>a validated psychometric taxonomy;</li>
<li>evidence that an insecurity is irrational;</li>
<li>evidence that the proposed maintenance mechanism applies to every person expressing the same insecurity.</li>
</ul>
<p>The strongest claim justified by the literature is narrower:</p>
<blockquote>
<p>Many forms of distress involve interactions among beliefs, conditional standards, attention, avoidance, checking, comparison, rumination, interpersonal expectations, uncertainty, environmental contingencies, and behavior. Several well-studied psychological traditions offer techniques for making these processes more specific and testable. The database organizes those ideas into response maps.</p>
</blockquote>
<p>The particular application of those ideas to the database&#39;s 100 entries remains a synthesis. It should therefore remain corrigible: if the person&#39;s actual evidence contradicts a formulation, the formulation should change.</p>
